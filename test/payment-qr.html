<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background-color: white;
        }
        body {
            background-color: #f5f5f5;
        }
        .qr-code {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }
        .qr-code img {
            max-width: 250px;
            margin: 0 auto;
            display: block;
        }
        .payment-info {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .amount {
            font-size: 24px;
            color: #28a745;
            font-weight: bold;
        }
        .btn-payment {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            margin: 20px 0;
        }
        .error-message {
            color: #dc3545;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-container">
            <h2 class="text-center mb-4">Thanh toán đơn hàng</h2>
            
            <div id="loading" class="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Đang tải...</span>
                </div>
            </div>

            <div id="error" class="error-message" style="display: none;"></div>
            
            <div id="paymentContent" style="display: none;">
                <div class="payment-info">
                    <div class="row">
                        <div class="col-6">
                            <p class="mb-1">Mã đơn hàng:</p>
                            <h4 id="orderId"></h4>
                        </div>
                        <div class="col-6 text-end">
                            <p class="mb-1">Số tiền:</p>
                            <div class="amount" id="amount"></div>
                        </div>
                    </div>
                </div>

                <div class="qr-code">
                    <h4 class="text-center mb-3">Quét mã QR để thanh toán</h4>
                    <img id="qrCode" src="" alt="QR Code thanh toán">
                    <p class="text-muted text-center mt-2">Sử dụng ứng dụng ngân hàng để quét mã</p>
                </div>

                <div class="text-center">
                    <p class="text-muted mb-2">Hoặc</p>
                    <a id="paymentLink" href="#" class="btn btn-primary btn-payment" target="_blank">
                        Thanh toán qua VNPay
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const orderId = 5; // Thay đổi orderId tại đây
        const API_URL = 'http://localhost:8090';

        async function loadPaymentInfo() {
            try {
                const response = await fetch(`${API_URL}/api/payment/create-payment/${orderId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Không thể tạo thanh toán');
                }

                const data = await response.json();
                
                // Hiển thị thông tin đơn hàng
                document.getElementById('orderId').textContent = '#' + data.orderId;
                document.getElementById('amount').textContent = new Intl.NumberFormat('vi-VN', {
                    style: 'currency',
                    currency: 'VND'
                }).format(data.amount);
                
                // Hiển thị QR code
                document.getElementById('qrCode').src = `data:image/png;base64,${data.qrCode}`;
                
                // Cập nhật link thanh toán
                document.getElementById('paymentLink').href = data.paymentUrl;
                
                // Ẩn loading và hiện nội dung
                document.getElementById('loading').style.display = 'none';
                document.getElementById('paymentContent').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errorElement = document.getElementById('error');
                errorElement.textContent = error.message;
                errorElement.style.display = 'block';
            }
        }

        // Tải thông tin thanh toán khi trang được load
        window.onload = loadPaymentInfo;
    </script>
</body>
</html>
