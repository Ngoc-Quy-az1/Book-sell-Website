<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .qr-code {
            text-align: center;
            margin: 20px 0;
        }
        .qr-code img {
            max-width: 200px;
            margin: 0 auto;
        }
        .payment-info {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .payment-status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }
        .status-failed {
            background-color: #f8d7da;
            color: #721c24;
        }
        .loading {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-container">
            <h2 class="text-center mb-4">Thanh toán đơn hàng</h2>
            
            <div id="loading" class="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div id="error" class="alert alert-danger" style="display: none;"></div>
            
            <div id="paymentContent" style="display: none;">
                <div class="payment-info">
                    <h4>Thông tin đơn hàng</h4>
                    <p><strong>Mã đơn hàng:</strong> <span id="orderId"></span></p>
                    <p><strong>Tổng tiền:</strong> <span id="amount"></span> VNĐ</p>
                </div>

                <div class="qr-code">
                    <h4>Quét mã QR để thanh toán</h4>
                    <img id="qrCode" src="" alt="QR Code">
                </div>

                <div class="text-center">
                    <a id="paymentLink" href="#" class="btn btn-primary" target="_blank">
                        Thanh toán qua VNPay
                    </a>
                </div>

                <div id="paymentStatus" class="payment-status status-pending">
                    Đang chờ thanh toán...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8090';
        let orderId = null;
        let checkStatusInterval = null;

        // Lấy orderId từ URL
        const urlParams = new URLSearchParams(window.location.search);
        orderId = urlParams.get('orderId');

        // Debug - kiểm tra URL và orderId
        console.log('URL:', window.location.href);
        console.log('Search params:', window.location.search);
        console.log('OrderId from URL:', orderId);

        if (!orderId) {
            showError('Không tìm thấy mã đơn hàng. Vui lòng kiểm tra URL (ví dụ: payment.html?orderId=5)');
        } else {
            // Tạo thanh toán và hiển thị QR code
            createPayment();
        }

        async function createPayment() {
            try {
                console.log('Đang tạo thanh toán cho đơn hàng:', orderId);
                const response = await fetch(`${API_URL}/api/payment/create-payment/${orderId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    throw new Error(`Không thể tạo thanh toán: ${errorData}`);
                }

                const data = await response.json();
                console.log('Dữ liệu thanh toán:', data);
                
                // Hiển thị thông tin đơn hàng
                document.getElementById('orderId').textContent = data.orderId;
                document.getElementById('amount').textContent = new Intl.NumberFormat('vi-VN').format(data.amount);
                
                // Hiển thị QR code
                document.getElementById('qrCode').src = `data:image/png;base64,${data.qrCode}`;
                
                // Cập nhật link thanh toán
                document.getElementById('paymentLink').href = data.paymentUrl;
                
                // Ẩn loading và hiện nội dung
                document.getElementById('loading').style.display = 'none';
                document.getElementById('paymentContent').style.display = 'block';
                
                // Bắt đầu kiểm tra trạng thái thanh toán
                startCheckingPaymentStatus();
            } catch (error) {
                console.error('Lỗi:', error);
                showError(error.message);
            }
        }

        function startCheckingPaymentStatus() {
            // Kiểm tra trạng thái mỗi 5 giây
            checkStatusInterval = setInterval(checkPaymentStatus, 5000);
        }

        async function checkPaymentStatus() {
            try {
                const response = await fetch(`${API_URL}/api/payment/check-status/${orderId}`);
                const data = await response.json();
                
                const statusElement = document.getElementById('paymentStatus');
                statusElement.className = 'payment-status';
                
                switch (data.status) {
                    case 'Completed':
                        statusElement.classList.add('status-completed');
                        statusElement.textContent = 'Thanh toán thành công!';
                        clearInterval(checkStatusInterval);
                        break;
                    case 'Failed':
                        statusElement.classList.add('status-failed');
                        statusElement.textContent = 'Thanh toán thất bại!';
                        clearInterval(checkStatusInterval);
                        break;
                    default:
                        statusElement.classList.add('status-pending');
                        statusElement.textContent = 'Đang chờ thanh toán...';
                }
            } catch (error) {
                console.error('Lỗi khi kiểm tra trạng thái:', error);
            }
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorElement = document.getElementById('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
    </script>
</body>
</html>
